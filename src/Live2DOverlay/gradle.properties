# JVM 参数：AGP 8.x 需要较大的元空间
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# ★ 本项目位于含中文的路径下（D:\AI Dsh\车机项目\Live2D悬浮窗\src\Live2DOverlay）。
# AGP 默认会因「项目路径含非 ASCII 字符」直接中止构建并报
#   "Your project path contains non-ASCII characters."
# 实测该检查对纯 Java/Kotlin + aapt2 的工程是保守告警，绕过检查后构建与真机运行均正常。
# 若不希望绕过：把工程整体放到纯 ASCII 路径（例如 D:\AtzGauge\Live2DOverlay）再构建。
android.overridePathCheck=true

# 并行与缓存
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
